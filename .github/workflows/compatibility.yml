name: compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tui-iced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries for iced, GPUI, and clipboard
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev
      - name: Compatibility smoke
        run: ./scripts/compat-check.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: System libraries for iced, GPUI, and clipboard
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev
      - name: Check declared MSRV
        run: cargo check --workspace --all-targets --locked

  windows-framework:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Windows framework tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p ferriso-core -p ferriso-config -p ferriso-diagnostics \
            -p ferriso-editor -p ferriso-platform -p ferriso-workspace \
            -p ferriso-keymap -p ferriso-tui -p ferriso-test -p ferriso-editor-app \
            -p ferriso-data-workbench
          cargo test --locked -p ferriso-platform --no-default-features
