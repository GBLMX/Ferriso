[package]
name = "ferriso-tui"
description = "Ratatui adapter for Ferriso: terminal event translation and native layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferriso-core = { workspace = true }
ferriso-keymap = { workspace = true }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
