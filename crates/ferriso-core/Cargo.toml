[package]
name = "ferriso-core"
description = "Actor-owned application state, semantic events, bounded command scheduling, and keyed subscriptions for Ferriso."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferriso-diagnostics = { workspace = true }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
