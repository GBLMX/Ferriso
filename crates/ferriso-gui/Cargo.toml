[package]
name = "ferriso-gui"
description = "Iced adapter for Ferriso: snapshot-driven rendering, never domain-state ownership."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferriso-diagnostics = { workspace = true }
ferriso-core = { workspace = true }
iced = { version = "0.14", features = ["tokio", "canvas", "image"] }
bytemuck = { version = "1", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

# naga 27.0.3 (through iced_wgpu -> wgpu 27) unconditionally compiles
# `emit_to_string`, which needs a `WriteColor` buffer. wgpu enables `wgsl-in`
# but not naga's `termcolor` feature, so unify it here.
naga = { version = "27", default-features = false, features = ["termcolor"] }
