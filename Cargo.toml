[workspace]
members = ["crates/ferriso-core", "crates/ferriso-tui", "crates/ferriso-gui", "apps/player"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/GBLMX/Ferriso"

[workspace.dependencies]
ferriso-core = { path = "crates/ferriso-core" }
ferriso-tui = { path = "crates/ferriso-tui" }
ferriso-gui = { path = "crates/ferriso-gui" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
