[workspace]
members = ["crates/ferriso", "crates/ferriso-ratatui", "crates/ferriso-iced", "apps/player"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/GBLMX/Ferriso"

[workspace.dependencies]
ferriso = { path = "crates/ferriso" }
ferriso-ratatui = { path = "crates/ferriso-ratatui" }
ferriso-iced = { path = "crates/ferriso-iced" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
