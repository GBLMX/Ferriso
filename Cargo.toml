[workspace]
members = ["crates/ferriso-core", "crates/ferriso-config", "crates/ferriso-tui", "crates/ferriso-gui", "crates/ferriso-floem", "crates/ferriso-gpui", "apps/player", "apps/yazi-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/GBLMX/Ferriso"

[workspace.dependencies]
anyhow = "1"
ferriso-diagnostics = { path = "crates/ferriso-diagnostics" }
ferriso-core = { path = "crates/ferriso-core" }
ferriso-config = { path = "crates/ferriso-config" }
ferriso-tui = { path = "crates/ferriso-tui" }
ferriso-gui = { path = "crates/ferriso-gui" }
ferriso-floem = { path = "crates/ferriso-floem" }
ferriso-gpui = { path = "crates/ferriso-gpui" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
