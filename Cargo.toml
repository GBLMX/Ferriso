[workspace]
members = [
    "crates/ferriso-diagnostics",
    "crates/ferriso-keymap",
    "crates/ferriso-core",
    "crates/ferriso-config",
    "crates/ferriso-platform",
    "crates/ferriso-test",
    "crates/ferriso-tracing",
    "crates/ferriso-tui",
    "crates/ferriso-gui",
    "crates/ferriso-workspace",
    "crates/ferriso-floem",
    "crates/ferriso-gpui",
    "crates/ferriso-editor",
    "crates/lsh",
    "apps/player",
    "apps/data-workbench",
    "apps/terminal",
    "apps/yazi-desktop",
    "apps/editor",
    "apps/twozero48",
    "apps/ferriso-cli",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/GBLMX/Ferriso"

[workspace.dependencies]
anyhow = "1"
clawless = "0.8"
ferriso-diagnostics = { path = "crates/ferriso-diagnostics" }
ferriso-core = { path = "crates/ferriso-core" }
ferriso-keymap = { path = "crates/ferriso-keymap" }
ferriso-test = { path = "crates/ferriso-test" }
ferriso-tracing = { path = "crates/ferriso-tracing" }
ferriso-config = { path = "crates/ferriso-config" }
# Native services are opt-in; consumers name the features they use.
ferriso-platform = { path = "crates/ferriso-platform", default-features = false }
ferriso-tui = { path = "crates/ferriso-tui" }
ferriso-gui = { path = "crates/ferriso-gui" }
ferriso-workspace = { path = "crates/ferriso-workspace" }
ferriso-floem = { path = "crates/ferriso-floem" }
ferriso-gpui = { path = "crates/ferriso-gpui" }
ferriso-editor = { path = "crates/ferriso-editor" }
lsh = { path = "crates/lsh" }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
