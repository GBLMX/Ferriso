[package]
name = "ferriso-player"
description = "The Ferriso practice app: one actor-owned model, two native renderers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferriso-core = { workspace = true }
ferriso-gui = { workspace = true }
ferriso-tui = { workspace = true }
tokio = { version = "1", features = ["time"] }

[lib]
name = "ferriso_player"
path = "src/lib.rs"

[[bin]]
name = "ferriso-player-tui"
path = "src/main_tui.rs"

[[bin]]
name = "ferriso-player-gui"
path = "src/main_gui.rs"
